[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raccca-eval"
version = "0.1.0"
description = "Enterprise RACCCA framework for evaluating LLM responses"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "RACCCA Contributors" }]
keywords = ["llm", "evaluation", "raccca", "prompt-engineering", "quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/raccca-eval/raccca-eval"
Documentation = "https://github.com/raccca-eval/raccca-eval#readme"
Repository = "https://github.com/raccca-eval/raccca-eval"

[tool.hatch.build.targets.wheel]
packages = ["raccca_eval"]

[tool.hatch.build.targets.sdist]
include = [
    "/raccca_eval",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests that require live LLM API keys",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["raccca_eval"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
